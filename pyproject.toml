[project]
name = "writing-audit"
version = "0.1.0"
description = "Research harnesses for the writing-with-ai Pangram audit and Layer-1 metrics"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8"]

[project.scripts]
writing-metrics = "writing_audit.cli:metrics_main"
track-p = "writing_audit.cli:track_p_main"
track-r = "writing_audit.cli:track_r_main"
prose-graph-viz = "writing_audit.prose_graph_viz:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/writing_audit"]

[tool.uv]
package = true
